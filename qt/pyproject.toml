[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fengrid"
version = "0.3.0.dev0"
description = "Fengrid — the UI asset explorer (Qt 6 workbench)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Qt 6.8 LTS line, per docs/architecture/0001-qt6-rewrite.md §2
    "PySide6>=6.8,<6.10",
    "pillow>=10.4",
    "defusedxml>=0.7",
    # SEC-7 (#9): C-level `timeout=` aborts catastrophic user regexes —
    # stdlib re cannot be preempted (a whole match is one GIL-held C call)
    "regex>=2024.4",
]

[project.scripts]
fengrid = "fengrid.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
