[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fengrid"
version = "0.3.0.dev0"
description = "Fengrid — the UI asset explorer (Qt 6 workbench)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Qt 6.8 LTS line, per docs/architecture/0001-qt6-rewrite.md §2
    "PySide6>=6.8,<6.10",
]

[project.scripts]
fengrid = "fengrid.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
