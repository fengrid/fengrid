<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open on your device — Fengrid</title>
<script src="vendor/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101418; --surface: #161B21; --border: #2A333B;
    --ink: #E7EDF2; --ink-muted: #93A3B0; --ink-faint: #5F6C78;
    --accent: #39B8C4; --accent-ink: #101418; --hl: #F5C25C;
    --font-head: 'Inter', 'Helvetica', 'Arial', sans-serif;
    --font-mono: 'Iosevka', 'Roboto Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink); font-family: var(--font-mono); padding: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px; text-align: center; max-width: 420px; width: 100%;
  }
  h1 { font-family: var(--font-head); text-transform: none; letter-spacing: 0.06em;
       font-size: 26px; margin: 0 0 6px; font-weight: 600; }
  h1 .wm-grid { font-family: var(--font-mono); font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }
  p.sub { color: var(--ink-muted); font-size: 12.5px; margin: 0 0 24px; line-height: 1.6; }
  .qr { display: inline-flex; padding: 12px; background: #fff; border-radius: 10px; }
  .qr svg, .qr canvas, .qr img { display: block; }
  .url { margin-top: 20px; font-size: 13px; color: var(--accent); word-break: break-all; }
  .alt { margin-top: 22px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
         color: var(--ink-faint); }
  .manual { margin-top: 8px; font-size: 11.5px; color: var(--ink-muted); word-break: break-all; }
  .err { color: var(--accent); font-size: 13px; }
</style>
</head>
<body data-lan-url="__LAN_URL__">
<div class="card">
  <h1><span class="wm-grid">fengrid</span> — open on your device</h1>
  <p class="sub">Scan this code with your phone or tablet — it opens the fengrid
  asset grid over your local network. Both devices must be on the same network.</p>
  <div class="qr" id="qr"><noscript>JavaScript is required to render the QR code.</noscript></div>
  <div class="url" id="url"></div>
  <div class="alt" id="byserver"></div>
  <div class="alt">Other interfaces on this machine</div>
  <div class="manual" id="manual">__ALT_INFO__</div>
</div>
<script>
(function () {
  // The URL in the address bar is, by definition, reachable from this
  // machine — use it unless it's a loopback the phone can't resolve, in
  // which case fall back to the LAN URL the server injected.
  var host = location.hostname;
  var loopback = host === "localhost" || host === "127.0.0.1" || host === "[::1]" || host === "::1";
  var injected = document.body.getAttribute("data-lan-url") || "";
  var target = loopback && injected && injected !== "__LAN_URL__"
    ? injected
    : location.origin + "/";
  document.getElementById("url").textContent = target;
  document.getElementById("byserver").textContent = loopback
    ? "(loopback: using server-reported LAN URL)" : "(from this page's own address)";
  var box = document.getElementById("qr");
  try {
      if (typeof qrcode !== "function") throw new Error("qr lib missing");
      var qr = qrcode(0, "M"); // auto version, medium error correction
      qr.addData(target);
      qr.make();
      // safe: createSvgTag() emits library-generated markup of a local URL —
      // no untrusted input flows into innerHTML
      box.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 0, scalable: true });
    var svg = box.querySelector("svg");
    svg.setAttribute("width", "220");
    svg.setAttribute("height", "220");
  } catch (e) {
    box.innerHTML = '<span class="err">QR unavailable — type the URL below manually.</span>';
  }
})();
</script>
</body>
</html>
