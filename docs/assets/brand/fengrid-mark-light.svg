<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fengrid primary mark, light-theme colors; transparent background.
       Glints are slate here: a white reflection is invisible on light ground. -->
  <defs>
    <radialGradient id="fgGlowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#F5B841" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#F5B841" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#F5B841" stop-opacity="0"/>
      <stop offset="1"    stop-color="#F5B841" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fgAmberL" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F8D47C"/>
      <stop offset="1" stop-color="#E0821F"/>
    </linearGradient>
  </defs>
  <circle cx="372" cy="372" r="130" fill="url(#fgGlowL)"/>
  <g fill="none" stroke="#0E7C86" stroke-width="22">
    <rect x="40" y="40" width="200" height="200" rx="36"/>
    <rect x="272" y="40" width="200" height="200" rx="36"/>
    <rect x="40" y="272" width="200" height="200" rx="36"/>
  </g>
  <g stroke="#6B7A88" stroke-opacity="0.45" stroke-width="16" stroke-linecap="round">
    <line x1="72"  y1="182" x2="180" y2="74"/>
    <line x1="304" y1="182" x2="412" y2="74"/>
    <line x1="72"  y1="414" x2="180" y2="306"/>
  </g>
  <rect x="272" y="272" width="200" height="200" rx="36" fill="url(#fgAmberL)"/>
  <circle cx="328" cy="328" r="16" fill="#FFF6DC" fill-opacity="0.95"/>
</svg>
