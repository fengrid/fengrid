<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fengrid single-color mark: currentColor throughout (glints at lower opacity
       are still single-color). No glow in mono — flat by design. Recolor by
       setting `color` on the parent element; renders black by default. -->
  <g fill="none" stroke="currentColor" stroke-width="22">
    <rect x="40" y="40" width="200" height="200" rx="36"/>
    <rect x="272" y="40" width="200" height="200" rx="36"/>
    <rect x="40" y="272" width="200" height="200" rx="36"/>
  </g>
  <g stroke="currentColor" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round">
    <line x1="72"  y1="182" x2="180" y2="74"/>
    <line x1="304" y1="182" x2="412" y2="74"/>
    <line x1="72"  y1="414" x2="180" y2="306"/>
  </g>
  <rect x="272" y="272" width="200" height="200" rx="36" fill="currentColor"/>
</svg>
