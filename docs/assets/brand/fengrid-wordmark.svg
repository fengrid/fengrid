<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <!-- Fengrid horizontal lockup, dark backgrounds: glint-quad mark + "fen"
       (Inter SemiBold) + "grid" (Noto Sans Mono, teal accent). Transparent bg. -->
  <defs>
    <radialGradient id="wmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#F5C25C" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#F5C25C" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#F5C25C" stop-opacity="0"/>
      <stop offset="1"    stop-color="#F5C25C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wmAmber" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F8D47C"/>
      <stop offset="1" stop-color="#E88A2D"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,32) scale(0.383)">
    <circle cx="372" cy="372" r="130" fill="url(#wmGlow)"/>
    <g fill="none" stroke="#39B8C4" stroke-width="34">
      <rect x="40" y="40" width="200" height="200" rx="36"/>
      <rect x="272" y="40" width="200" height="200" rx="36"/>
      <rect x="40" y="272" width="200" height="200" rx="36"/>
    </g>
    <g stroke="#BFE9ED" stroke-opacity="0.42" stroke-width="24" stroke-linecap="round">
      <line x1="72"  y1="182" x2="180" y2="74"/>
      <line x1="304" y1="182" x2="412" y2="74"/>
      <line x1="72"  y1="414" x2="180" y2="306"/>
    </g>
    <rect x="272" y="272" width="200" height="200" rx="36" fill="url(#wmAmber)"/>
    <circle cx="328" cy="328" r="26" fill="#FBE7B4" fill-opacity="0.95"/>
  </g>
  <text x="248" y="178" font-family="Inter" font-weight="600" font-size="150" fill="#E7EDF2">fen</text>
  <text x="466" y="172" font-family="Noto Sans Mono" font-weight="bold" font-size="136" fill="#39B8C4">grid</text>
</svg>
