<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fengrid code — the snippet explorer</title>
<meta name="description" content="fengrid code: write, preview, tag, and organise HTML/CSS/JS snippets. Local-first, SQLite-backed, no account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='12' height='12' rx='3' fill='none' stroke='%23F0885C' stroke-width='2.5'/%3E%3Crect x='17' y='3' width='12' height='12' rx='3' fill='none' stroke='%23F0885C' stroke-width='2.5'/%3E%3Crect x='3' y='17' width='12' height='12' rx='3' fill='none' stroke='%23F0885C' stroke-width='2.5'/%3E%3Crect x='17' y='17' width='12' height='12' rx='3.5' fill='%23F5C25C'/%3E%3C/svg%3E">
<style>
  @font-face { font-family:'Inter'; src:url('fonts/Inter-Variable.woff2') format('woff2-variations'); font-weight:100 900; font-style:normal; font-display:swap; }
  @font-face { font-family:'Iosevka'; src:url('fonts/IosevkaMono-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:'Iosevka'; src:url('fonts/IosevkaMono-Medium.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }

  :root { --font-head:'Inter',sans-serif; --font-mono:'Iosevka','Roboto Mono',monospace; --font-body:'Inter',sans-serif; }
  /* code mode accent: coral — icons are teal, fonts are violet, code is coral.
     The lit-pane amber (--hl) remains the shared interaction accent. */
  [data-theme="dark"] {
    --bg:#101418; --surface:#161B21; --surface-2:#1D242B;
    --border:#2A333B; --border-strong:#3B454F;
    --ink:#E7EDF2; --ink-muted:#93A3B0; --ink-faint:#5F6C78;
    --accent:#F0885C; --accent-ink:#101418; --accent-soft:rgba(240,136,92,0.14);
    --hl:#F5C25C; --hl-ink:#F5C25C; --hl-contrast:#101418; --hl-soft:rgba(245,194,92,0.15);
    --shadow:0 12px 32px rgba(0,0,0,0.45);
  }
  [data-theme="light"] {
    --bg:#F7F8F9; --surface:#FFFFFF; --surface-2:#ECEEF1;
    --border:#DFE3E7; --border-strong:#C3CAD1;
    --ink:#16202B; --ink-muted:#6B7A88; --ink-faint:#9AA6B0;
    --accent:#C44A1E; --accent-ink:#FFFFFF; --accent-soft:rgba(196,74,30,0.12);
    --hl:#F5B841; --hl-ink:#A16207; --hl-contrast:#16202B; --hl-soft:rgba(245,184,65,0.15);
    --shadow:0 12px 32px rgba(22,32,43,0.12);
  }

  /* syntax highlighting tokens */
  .tk-t { color: var(--accent); }          /* tags */
  .tk-a { color: var(--hl-ink); }          /* attribute names / CSS props */
  .tk-s { color: #98C379; }                /* strings */
  .tk-c { color: var(--ink-faint); font-style: italic; }  /* comments */
  .tk-k { color: var(--accent); }          /* JS keywords */
  .tk-n { color: var(--hl-ink); }          /* numbers */
  .tk-f { color: var(--ink); font-weight: 500; }  /* CSS selectors / fns */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  h1 { font-family: var(--font-head); font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
  .wordmark { text-transform: none; font-weight: 600; letter-spacing: 0.06em; }
  .wordmark .wm-grid { font-family: var(--font-mono); font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }

  /* layout: sidebar + main */
  .app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  .app > header { grid-column: 1 / -1; }
  .sidebar { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); padding: 14px; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title-row h1 { font-size: 22px; }
  .mode-switch { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .mode-switch a { font-family: var(--font-mono); font-size: 11px; padding: 0 10px; line-height: 30px; text-decoration: none; color: var(--ink-muted); background: var(--surface-2); }
  .mode-switch a.active { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .spacer { flex: 1; }
  .hdr-btn { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--surface-2); color: var(--ink-muted); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .hdr-btn:hover { color: var(--accent); border-color: var(--accent); }
  .hdr-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .hdr-btn.primary:hover { filter: brightness(1.1); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-muted); }
  .icon-btn:hover { color: var(--ink); border-color: var(--border-strong); }
  [data-theme="dark"] .sun { display: block; } [data-theme="dark"] .moon { display: none; }
  [data-theme="light"] .sun { display: none; } [data-theme="light"] .moon { display: block; }

  /* snippet browser sidebar */
  .side-search { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; color: var(--ink); font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; outline: none; margin-bottom: 8px; }
  .side-search:focus { border-color: var(--accent); }
  .side-filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .side-filters select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; color: var(--ink-muted); font-family: var(--font-mono); font-size: 10.5px; padding: 3px 6px; cursor: pointer; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tag-chip { font-family: var(--font-mono); font-size: 10px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; border-radius: 99px; padding: 2px 8px; cursor: pointer; }
  .tag-chip.active, .tag-chip:hover { border-color: var(--accent); }
  .snippet-list { display: flex; flex-direction: column; gap: 4px; }
  .snip-item { padding: 8px 10px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .snip-item:hover { background: var(--surface-2); }
  .snip-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .snip-item .t { font-family: var(--font-mono); font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snip-item .m { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); margin-top: 2px; }
  .snip-item .tg { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .snip-item .tg span { font-family: var(--font-mono); font-size: 9px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 6px; }
  .side-new { width: 100%; margin-bottom: 10px; }

  /* editor + preview area */
  .editor-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 8px; }
  .editor-tabs button { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; padding: 8px 16px 7px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-faint); cursor: pointer; }
  .editor-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .code-area { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .code-area.preview-only { grid-template-columns: 1fr; }
  .editor-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
  .preview-pane { display: flex; flex-direction: column; min-height: 0; }
  .pane-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); padding: 6px 12px 4px; }

  .editor-wrap { position: relative; flex: 1; min-height: 0; }
  .editor-hl, .editor-ta {
    position: absolute; inset: 0; margin: 0; padding: 12px 14px;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.55;
    white-space: pre; word-wrap: normal; tab-size: 2;
    overflow: auto; border: none;
  }
  .editor-hl { pointer-events: none; color: var(--ink); background: var(--bg); z-index: 1; overflow: hidden; }
  .editor-hl code { display: block; min-height: 100%; }
  .editor-ta { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; z-index: 2; }
  .editor-ta::selection { background: var(--accent-soft); color: transparent; }

  .preview-frame { flex: 1; border: none; background: #fff; width: 100%; }
  .preview-bar { display: flex; align-items: center; gap: 8px; padding: 4px 12px; }
  .preview-bar .label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }

  /* modals */
  .modal-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); }
  .modal-overlay[hidden] { display: none; }
  .modal-card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 18px 22px 16px; max-width: 480px; box-shadow: var(--shadow); text-align: left; width: 90%; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .modal-head .label { color: var(--accent); letter-spacing: 0.14em; }
  .modal-field { margin-bottom: 10px; }
  .modal-field label { display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 4px; }
  .modal-field input, .modal-field textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; color: var(--ink); font-family: var(--font-mono); font-size: 12.5px; padding: 7px 10px; outline: none; }
  .modal-field input:focus, .modal-field textarea:focus { border-color: var(--accent); }
  .modal-field textarea { height: 60px; resize: vertical; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(16px); z-index: 70; background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 18px; font-family: var(--font-mono); font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: all 0.2s ease; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .sidebar { max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
    .code-area { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .editor-pane { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title-row">
      <div class="mode-switch">
        <a href="index.html">Icons</a>
        <a href="fonts.html">Fonts</a>
        <a href="code.html" class="active">Code</a>
      </div>
      <h1 class="wordmark">fen<span class="wm-grid">grid</span></h1>
      <span class="count" id="snip-count"></span>
    </div>
    <span class="spacer"></span>
    <button class="hdr-btn" id="btn-export">Export HTML</button>
    <button class="hdr-btn" id="btn-run">Run ▸</button>
    <button class="hdr-btn primary" id="btn-save">Save</button>
    <button class="icon-btn" id="mode-btn" title="Toggle light / dark">
      <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <!-- snippet browser sidebar -->
  <div class="sidebar">
    <button class="hdr-btn primary side-new" id="btn-new">+ New snippet</button>
    <input type="text" class="side-search" id="snip-search" placeholder="search snippets…">
    <div class="side-filters">
      <select id="snip-sort"><option value="updated">Recent</option><option value="title">Title</option><option value="created">Created</option></select>
      <select id="snip-lang"><option value="">All langs</option><option value="web">Web</option><option value="markdown">Markdown</option></select>
    </div>
    <div class="tag-cloud" id="tag-cloud"></div>
    <div class="snippet-list" id="snippet-list"></div>
  </div>

  <!-- editor + preview -->
  <div class="main">
    <div class="editor-tabs" id="ed-tabs">
      <button class="active" data-pane="html">HTML</button>
      <button data-pane="css">CSS</button>
      <button data-pane="js">JS</button>
    </div>
    <div class="code-area" id="code-area">
      <div class="editor-pane">
        <div class="pane-label" id="ed-label">HTML</div>
        <div class="editor-wrap">
          <pre class="editor-hl" aria-hidden="true"><code id="hl-code"></code></pre>
          <textarea class="editor-ta" id="ed-code" spellcheck="false" wrap="off"></textarea>
        </div>
      </div>
      <div class="preview-pane">
        <div class="preview-bar">
          <span class="label">Result</span>
          <span class="spacer"></span>
          <button class="hdr-btn" id="btn-refresh-preview" title="Refresh preview">↻</button>
        </div>
        <iframe class="preview-frame" id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>
</div>

<!-- save modal -->
<div id="save-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <span class="label">Save snippet</span>
      <button class="icon-btn" id="save-close" title="Close">✕</button>
    </div>
    <div class="modal-field"><label>Title</label><input type="text" id="save-title" placeholder="My snippet"></div>
    <div class="modal-field"><label>Description</label><textarea id="save-desc" placeholder="What does this do?"></textarea></div>
    <div class="modal-field"><label>Tags (comma-separated)</label><input type="text" id="save-tags" placeholder="css, layout, demo"></div>
    <div class="modal-field"><label>Language</label><select id="save-lang" style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--ink);font-family:var(--font-mono);font-size:12.5px;padding:7px 10px;"><option value="web">Web (HTML+CSS+JS)</option><option value="markdown">Markdown</option></select></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="hdr-btn primary" id="save-confirm" style="flex:1;">Save</button>
      <button class="hdr-btn" id="save-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var editors = { html: '', css: '', js: '' };
  var currentLang = 'html';
  var currentId = null;  // null = unsaved new snippet
  var dirty = false;
  var toastTimer;

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ---------- syntax highlighting (regex tokenizer, no dependencies) -----
     Uses Unicode private-use-area placeholders to protect already-wrapped
     tokens from subsequent regex passes. */
  var PH = '\uE000';
  function highlight(code, lang) {
    var s = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var tokens = [];
    function wrap(cls, m) {
      tokens.push('<span class="tk-' + cls + '">' + m + '</span>');
      return PH + String.fromCharCode(0xE001 + tokens.length - 1) + PH;
    }
    if (lang === 'html') {
      s = s.replace(/&lt;!--[\s\S]*?--&gt;/g, function (m) { return wrap('c', m); });
      s = s.replace(/&lt;\/?[\w-]+/g, function (m) { return wrap('t', m); });
      s = s.replace(/[\w-]+(?==)/g, function (m) { return wrap('a', m); });
      s = s.replace(/&quot;[^&]*?&quot;/g, function (m) { return wrap('s', m); });
    } else if (lang === 'css') {
      s = s.replace(/\/\*[\s\S]*?\*\//g, function (m) { return wrap('c', m); });
      s = s.replace(/@[\w-]+/g, function (m) { return wrap('k', m); });
      s = s.replace(/[.#][\w-]+(?=[\s,{:])/g, function (m) { return wrap('f', m); });
      s = s.replace(/[\w-]+(?=\s*:)/g, function (m) { return wrap('a', m); });
      s = s.replace(/#[0-9a-fA-F]{3,8}\b|\b\d+\.?\d*(?:px|em|rem|%|vh|vw|s|ms|deg|fr)?\b/g, function (m) { return wrap('n', m); });
    } else {  // js
      s = s.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, function (m) { return wrap('c', m); });
      s = s.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`/g, function (m) { return wrap('s', m); });
      s = s.replace(/\b(var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|this|typeof|instanceof|null|undefined|true|false|class|extends|import|export|from|async|await|try|catch|finally|throw|delete|in|of)\b/g, function (m) { return wrap('k', m); });
      s = s.replace(/\b\d+\.?\d*\b/g, function (m) { return wrap('n', m); });
    }
    return s.replace(/\uE000(.)\uE000/g, function (_, c) { return tokens[c.charCodeAt(0) - 0xE001] || ''; });
  }

  /* ---------- editor (highlighted textarea overlay) ---------- */
  var edTa = $('ed-code'), edHl = $('hl-code');
  var currentPane = 'html';

  function setPane(lang) {
    // save current pane content
    editors[currentPane] = edTa.value;
    currentPane = lang;
    currentLang = lang;
    edTa.value = editors[lang];
    $('ed-label').textContent = lang.toUpperCase();
    document.querySelectorAll('#ed-tabs button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.pane === lang);
    });
    refreshHighlight();
    dirty = true;
  }

  function refreshHighlight() {
    edHl.innerHTML = highlight(edTa.value, currentPane) + '\n';
    syncScroll();
  }

  function syncScroll() {
    edHl.parentNode.scrollTop = edTa.scrollTop;
    edHl.parentNode.scrollLeft = edTa.scrollLeft;
    edHl.style.transform = 'translate(-' + edTa.scrollLeft + 'px,-' + edTa.scrollTop + 'px)';
  }

  edTa.addEventListener('input', function () {
    editors[currentPane] = edTa.value;
    refreshHighlight();
    dirty = true;
  });
  edTa.addEventListener('scroll', syncScroll);
  edTa.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = this.selectionStart, en = this.selectionEnd;
      this.value = this.value.slice(0, s) + '  ' + this.value.slice(en);
      this.selectionStart = this.selectionEnd = s + 2;
      editors[currentPane] = this.value;
      refreshHighlight();
      dirty = true;
    }
  });

  document.getElementById('ed-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pane]');
    if (b) setPane(b.dataset.pane);
  });

  /* ---------- preview ---------- */
  function runPreview() {
    var html = editors.html, css = editors.css, js = editors.js;
    if (currentId) {
      // check language
      // (the lang is stored per-snippet; markdown renders differently)
    }
    var doc = '<!DOCTYPE html><html><head><style>' + css + '</style></head><body>' +
      html + '<script>' + js + '<\/script></body></html>';
    $('preview').srcdoc = doc;
  }

  document.getElementById('btn-run').addEventListener('click', runPreview);
  document.getElementById('btn-refresh-preview').addEventListener('click', runPreview);

  /* ---------- snippet CRUD ---------- */
  function loadList() {
    var q = $('snip-search').value.trim();
    var sort = $('snip-sort').value;
    var lang = $('snip-lang').value;
    var url = '/api/snippets?sort=' + sort;
    if (q) url += '&q=' + encodeURIComponent(q);
    if (lang) url += '&lang=' + lang;  // NOTE: server doesn't filter lang yet — client-side filter
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return;
      var items = d.snippets;
      if (lang) items = items.filter(function (s) { return s.language === lang; });
      $('snip-count').textContent = items.length + ' snippets';
      var list = $('snippet-list');
      list.innerHTML = items.map(function (s) {
        var tags = (s.tags || '').split(',').filter(Boolean).map(function (t) {
          return '<span>' + esc(t.trim()) + '</span>';
        }).join('');
        return '<div class="snip-item' + (s.id === currentId ? ' active' : '') + '" data-id="' + s.id + '">' +
          '<div class="t">' + esc(s.title) + '</div>' +
          '<div class="m">' + esc(s.language) + ' · ' + esc(s.updated || '').slice(0, 10) + '</div>' +
          (tags ? '<div class="tg">' + tags + '</div>' : '') + '</div>';
      }).join('') || '<div class="snip-item"><div class="m">No snippets yet — create one!</div></div>';
      loadTagCloud();
    });
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function loadTagCloud() {
    fetch('/api/tags').then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return;
      $('tag-cloud').innerHTML = d.tags.slice(0, 20).map(function (t) {
        return '<button class="tag-chip" data-tag="' + esc(t.name) + '">' + esc(t.name) + ' (' + t.count + ')</button>';
      }).join('');
    });
  }

  $('tag-cloud').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tag]');
    if (!b) return;
    var tag = b.dataset.tag;
    // toggle active
    var active = b.classList.toggle('active');
    // filter list by tag (client-side refetch)
    var url = '/api/snippets?sort=' + $('snip-sort').value;
    if (active) url += '&tag=' + encodeURIComponent(tag);
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return;
      $('snippet-list').innerHTML = d.snippets.map(function (s) {
        return '<div class="snip-item" data-id="' + s.id + '"><div class="t">' + esc(s.title) + '</div><div class="m">' + esc(s.language) + '</div></div>';
      }).join('');
    });
  });

  $('snippet-list').addEventListener('click', function (e) {
    var item = e.target.closest('[data-id]');
    if (!item) return;
    loadSnippet(+item.dataset.id);
  });

  function loadSnippet(id) {
    fetch('/api/snippets/' + id).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) return toast('Failed to load snippet');
      var s = d.snippet;
      currentId = s.id;
      editors = { html: s.html || '', css: s.css || '', js: s.js || '' };
      // load into whichever pane is active
      edTa.value = editors[currentPane];
      refreshHighlight();
      runPreview();
      loadList();
      dirty = false;
    });
  }

  /* save */
  document.getElementById('btn-save').addEventListener('click', function () {
    editors[currentPane] = edTa.value;  // capture current pane
    if (currentId) {
      // update existing
      fetch('/api/snippets/' + currentId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ html: editors.html, css: editors.css, js: editors.js })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) { toast('Saved'); dirty = false; loadList(); }
        else toast('Save failed');
      });
    } else {
      $('save-modal').hidden = false;
      $('save-title').focus();
    }
  });

  document.getElementById('save-confirm').addEventListener('click', function () {
    var title = $('save-title').value.trim() || 'Untitled';
    fetch('/api/snippets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: title, description: $('save-desc').value,
        language: $('save-lang').value,
        html: editors.html, css: editors.css, js: editors.js,
        tags: $('save-tags').value
      })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        currentId = d.snippet.id;
        $('save-modal').hidden = true;
        toast('Saved: ' + title);
        dirty = false;
        loadList();
        runPreview();
      } else toast('Save failed');
    });
  });
  document.getElementById('save-cancel').addEventListener('click', function () { $('save-modal').hidden = true; });
  document.getElementById('save-close').addEventListener('click', function () { $('save-modal').hidden = true; });

  /* new */
  document.getElementById('btn-new').addEventListener('click', function () {
    currentId = null;
    editors = { html: '', css: '', js: '' };
    edTa.value = '';
    refreshHighlight();
    $('preview').srcdoc = '';
    loadList();
    toast('New snippet — Save to name it');
  });

  /* export */
  document.getElementById('btn-export').addEventListener('click', function () {
    editors[currentPane] = edTa.value;
    var doc = '<!DOCTYPE html>\n<html>\n<head>\n<style>\n' + editors.css + '\n</style>\n</head>\n<body>\n' +
      editors.html + '\n<script>\n' + editors.js + '\n<\/script>\n</body>\n</html>';
    var blob = new Blob([doc], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (currentId ? 'snippet-' + currentId : 'fengrid-snippet') + '.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Exported standalone HTML');
  });

  /* search + sort + lang filter */
  $('snip-search').addEventListener('input', function () { loadList(); });
  $('snip-sort').addEventListener('change', function () { loadList(); });
  $('snip-lang').addEventListener('change', function () { loadList(); });

  /* theme */
  document.getElementById('mode-btn').addEventListener('click', function () {
    var mode = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = mode;
    localStorage.setItem('fgc-mode', mode);
  });
  (function () {
    var saved = localStorage.getItem('fgc-mode');
    if (!saved) saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = saved;
  })();

  /* keyboard: Ctrl+S save, Ctrl+Enter run */
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); document.getElementById('btn-save').click(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runPreview(); }
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay:not([hidden])').forEach(function (m) { m.hidden = true; });
    }
  });

  /* boot */
  loadList();
  runPreview();  // render the default empty state
})();
</script>
</body>
</html>
